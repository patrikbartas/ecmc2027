<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECMC 2027 Bratislava — coming soon</title>
<meta name="description" content="ECMC 2027 Bratislava — coming soon.">
<meta name="theme-color" content="#410056">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23410056'/></svg>">
<style>
  :root{
    --black:#000000;
    --white:#ffffff;
    --red:#b2000e;
    --yellow:#fece00;
    --purple:#410056;
    --turquoise:#0ec9ae;
    --cycle:60s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:grid;
    place-items:center;
    padding:6vmin;
    background:var(--black);
    font-family:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    animation:bg var(--cycle) ease-in-out infinite;
  }
  a{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4vmin;
    color:var(--white);
    text-decoration:none;
    text-align:center;
    font-size:clamp(.85rem,2.6vmin,1.4rem);
    font-weight:700;
    line-height:1.1;
    letter-spacing:.12em;text-transform:uppercase;
    animation:fg var(--cycle) step-end infinite;
  }
  /* Logo sa vykresľuje ako maska, takže preberá currentColor spolu s textom.
     logo.svg netreba nijako upravovať – použije sa len jeho tvar, nie farba. */
  .logo{
    width:min(58vmin,360px);
    aspect-ratio:91.99/117.42;
    background-color:currentColor;
    -webkit-mask:url(logo.svg) center/contain no-repeat;
    mask:url(logo.svg) center/contain no-repeat;
  }
  /* Skryté pre oči, čitateľné pre vyhľadávače a čítačky obrazovky */
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

  @keyframes bg{
    0%,8.33%    {background-color:var(--black)}
    16.66%,25%  {background-color:var(--red)}
    33.33%,41.66%{background-color:var(--yellow)}
    50%,58.33%  {background-color:var(--purple)}
    66.66%,75%  {background-color:var(--turquoise)}
    83.33%,91.66%{background-color:var(--white)}
    100%        {background-color:var(--black)}
  }
  /* Text sa preklopí uprostred prechodu, aby bol vždy čitateľný */
  @keyframes fg{
    0%      {color:var(--white)}  /* čierna + červená */
    29.16%  {color:var(--black)}  /* žltá */
    45.83%  {color:var(--white)}  /* fialová */
    62.5%   {color:var(--black)}  /* tyrkysová + biela */
    95.83%  {color:var(--white)}  /* späť na čiernu */
  }
  @media (prefers-reduced-motion:reduce){
    body,a{animation:none}
    body{background:var(--purple)}
    a{color:var(--white)}
  }
</style>
</head>
<body>
  <a href="https://www.instagram.com/ecmc2027/" target="_blank" rel="noopener">
    <h1 class="logo"><span class="sr-only">ECMC 2027 Bratislava — European Cycle Messenger Championships</span></h1>
    coming soon
  </a>
</body>
</html>
