<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Krabice — test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  #stage { position: relative; width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
  #stage img, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stage img { user-select: none; pointer-events: none; }
  #hud {
    position: fixed; left: 8px; bottom: 8px; padding: 6px 10px; border-radius: 6px;
    background: rgba(0, 0, 0, .65); pointer-events: none; white-space: pre;
  }
  #hud b { color: #ffd23f; }
</style>
</head>
<body>
<div id="stage">
  <img id="foto" alt="">
</div>
<div id="hud"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
