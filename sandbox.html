<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ECMC 2027 — sandbox</title>
<style>
  :root{
    --black:#000;--white:#fff;--red:#b2000e;--yellow:#fece00;--purple:#410056;--turquoise:#0ec9ae;
    --cycle:60s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--black);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    animation:bg var(--cycle) ease-in-out infinite;
  }

  #plocha{position:fixed;inset:0;z-index:0;display:block}
  #plocha.mozem-chytit{cursor:grab}
  #plocha.chytam{cursor:grabbing}

  .stred{position:fixed;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none;
         color:var(--white);animation:fg var(--cycle) step-end infinite}
  .logo{width:min(58vmin,360px);aspect-ratio:91.99/117.42;background-color:currentColor;
        -webkit-mask:url(logo.svg) center/contain no-repeat;mask:url(logo.svg) center/contain no-repeat}

  @keyframes bg{
    0%,8.33%     {background-color:var(--black)}
    16.66%,25%   {background-color:var(--red)}
    33.33%,41.66%{background-color:var(--yellow)}
    50%,58.33%   {background-color:var(--purple)}
    66.66%,75%   {background-color:var(--turquoise)}
    83.33%,91.66%{background-color:var(--white)}
    100%         {background-color:var(--black)}
  }
  @keyframes fg{
    0%{color:var(--white)} 29.16%{color:var(--black)} 45.83%{color:var(--white)}
    62.5%{color:var(--black)} 95.83%{color:var(--white)}
  }
  /* Sprity sa prefarbujú v JS (kresli()), nie CSS filtrom – dvojfarebný bicykel
     sa jedným brightness() prefarbiť nedá. Zlomy nižšie musia sedieť s @keyframes fg. */

  /* Statické režimy – systém bicyklov je od farebnej animácie nezávislý. */
  body.stat, body.stat .stred{animation:none}
  body.stat-cierna{background:var(--black)}  body.stat-cierna .stred{color:var(--white)}
  body.stat-biela {background:var(--white)}  body.stat-biela  .stred{color:var(--black)}

  /* ---------------- panel (H) ---------------- */
  #panel{
    position:fixed;top:16px;left:16px;z-index:9;width:344px;
    background:#0b0b0bee;color:#fff;border:1px solid #ffffff26;border-radius:10px;
    padding:16px 18px 14px;font-size:12px;backdrop-filter:blur(10px);
    box-shadow:0 8px 30px #0009;
  }
  #panel[hidden]{display:none}
  #panel h2{font-size:10px;letter-spacing:.18em;opacity:.45;font-weight:400;margin-bottom:14px}
  #panel .skupina{margin-bottom:16px}
  #panel .skupina:last-of-type{margin-bottom:8px}
  #panel .nadpis{font-size:9px;letter-spacing:.16em;opacity:.35;margin-bottom:8px;
                 border-top:1px solid #ffffff14;padding-top:10px}
  #panel .r{display:grid;grid-template-columns:1fr 132px 44px;align-items:center;gap:10px;
            height:24px}
  #panel .r span:first-child{opacity:.8;white-space:nowrap}
  #panel b{font-weight:400;font-variant-numeric:tabular-nums;text-align:right;opacity:.95}
  #panel input[type=range]{width:132px;accent-color:#fff;height:14px}
  #panel select{width:132px;background:#000;color:#fff;border:1px solid #ffffff26;
                border-radius:4px;font:inherit;font-size:11px;padding:2px 4px}
  #panel input[type=color]{width:132px;height:18px;padding:0;background:none;
                border:1px solid #ffffff26;border-radius:4px;cursor:pointer}
  #panel .skupina.tlmena{opacity:.3}
  #panel .stopa{font-size:10px;opacity:.35;line-height:1.6;border-top:1px solid #ffffff14;
                padding-top:10px}
  #panel .stopa kbd{border:1px solid #ffffff33;border-radius:3px;padding:0 4px;font:inherit}
</style>
</head>
<body>
<canvas id="plocha"></canvas>
<div class="stred"><div class="logo"></div></div>

<div id="panel" hidden>
  <h2>SANDBOX</h2>

  <div class="skupina">
    <div class="nadpis" style="border:0;padding:0">GRAFIKA</div>
    <div class="r"><span>sada</span><select id="cSada">
      <option value="nova">iba nová (96 px)</option>
      <option value="stara">iba stará (48 px)</option>
      <option value="obe">obe naraz</option>
    </select><b></b></div>
  </div>

  <div class="skupina">
    <div class="nadpis">POHYB</div>
    <div class="r"><span>počet</span><input id="cPocet" type="range" min="1" max="60" value="12"><b id="vPocet">12</b></div>
    <div class="r"><span>rýchlosť</span><input id="cRychlost" type="range" min="10" max="300" value="100"><b id="vRychlost">1.0</b></div>
    <div class="r"><span>veľkosť</span><input id="cMierka" type="range" min="5" max="20" value="10"><b id="vMierka">1.0</b></div>
    <div class="r"><span>pauzy</span><input id="cPauzy" type="range" min="0" max="100" value="63"><b id="vPauzy">63</b></div>
  </div>

  <div class="skupina" id="gMix">
    <div class="nadpis">POMER STARÝCH BICYKLOV</div>
    <div class="r"><span>mestský</span><input id="cMix0" type="range" min="0" max="100" value="33"><b id="vMix0">33%</b></div>
    <div class="r"><span>velociped</span><input id="cMix1" type="range" min="0" max="100" value="33"><b id="vMix1">33%</b></div>
    <div class="r"><span>cargo</span><input id="cMix2" type="range" min="0" max="100" value="34"><b id="vMix2">34%</b></div>
  </div>

  <div class="skupina">
    <div class="nadpis">VZHĽAD</div>
    <div class="r"><span>pozadie</span><select id="cPozadie">
      <option value="rotacia">rotácia farieb</option>
      <option value="cierna">statická čierna</option>
      <option value="biela">statická biela</option>
    </select><b></b></div>
    <div class="r"><span>telo</span><input id="cTelo" type="color" value="#6b6b6b"><b></b></div>
    <div class="r"><span>vidlica</span><input id="cVidlica" type="color" value="#ffffff"><b></b></div>
  </div>

  <div class="stopa"><kbd>B</kbd> bicykle &nbsp; <kbd>H</kbd> panel &nbsp;·&nbsp; <b id="fps">–</b> fps</div>
</div>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Sady grafiky
//
// Nakreslených je 5 smerov, zvyšné 3 vznikajú preklopením. Sady sa líšia veľkosťou
// bunky, počtom snímok aj poradím riadkov, takže si to každá nesie sama.
//
// stará – bunka 48, 4 snímky, 6 riadkov (5 smerov + trackstand), jednofarebná
// nová  – bunka 96, 3 snímky, 5 riadkov, DVOJFAROVÁ. Trackstand zatiaľ nie je
//         nakreslený, berie sa zaň stojaci bok.
//
// Dvojfarebnosť: súbor nesie dve vrstvy pod sebou – horná polovica je telo,
// dolná vidlica. Obe sú biele masky na priehľadnom, takže sa dajú vyfarbiť
// ľubovoľnou dvojicou farieb cez composite operácie. Zámerne bez getImageData –
// to by na file:// spadlo na tainted canvas.
// ---------------------------------------------------------------------------
const SADY = {
  stara: {
    bunka:48, snimok:4, vrstvy:1, maTrackstand:true,
    riadok:{ E:0, S:1, N:2, SE:3, NE:4, TRACKSTAND:5 },
    typy:{
      mestsky:   'assets/sprites/bike-city.png',
      velociped: 'assets/sprites/bike-velociped.png',
      cargo:     'assets/sprites/bike-cargo.png',
    },
  },
  nova: {
    bunka:96, snimok:3, vrstvy:2, maTrackstand:false,
    riadok:{ N:0, NE:1, E:2, SE:3, S:4 },
    typy:{ 'mestsky-96': 'assets/sprites/bike-city-96-v1.png' },
  },
};
for(const s of Object.values(SADY)) s.riadkov = Math.max(...Object.values(s.riadok)) + 1;

// poradie zodpovedá atan2: 0=E 1=SE 2=S 3=SW 4=W 5=NW 6=N 7=NE
const SEKTOR = [
  {smer:'E', flip:false}, {smer:'SE', flip:false},
  {smer:'S', flip:false}, {smer:'SE', flip:true },
  {smer:'E', flip:true }, {smer:'NE', flip:true },
  {smer:'N', flip:false}, {smer:'NE', flip:false},
];

// typ bicykla -> { sada, obrázok, prefarbené plátno }
const KUSY = {};
const STARE_TYPY = Object.keys(SADY.stara.typy);
for(const [idSady, sada] of Object.entries(SADY)){
  for(const [typ, subor] of Object.entries(sada.typy)){
    const z = KUSY[typ] = { idSady, sada, img:null, kluc:null, platno:null };
    const i = new Image();
    i.onload  = () => { z.img = i; };
    i.onerror = () => console.warn('nenačítalo sa', subor);
    i.src = subor;
  }
}

// ---------------------------------------------------------------------------
// Prefarbenie sheetu. Beží iba keď sa farba naozaj zmení – čiže pri posunutí
// vzorkovníka a dvakrát za cyklus pozadia, nie každý snímok.
// ---------------------------------------------------------------------------
const pomPlatno = document.createElement('canvas');
const pomCtx = pomPlatno.getContext('2d');

function prefarbeny(z, telo, vidlica){
  const kluc = telo + '|' + vidlica;
  if(z.kluc === kluc) return z.platno;
  const s = z.sada, w = s.snimok*s.bunka, h = s.riadkov*s.bunka;
  const c = z.platno || (z.platno = document.createElement('canvas'));
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(z.img, 0, 0, w, h, 0, 0, w, h);      // vrstva tela
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = telo; g.fillRect(0,0,w,h);
  g.globalCompositeOperation = 'source-over';
  if(s.vrstvy === 2){
    pomPlatno.width = w; pomPlatno.height = h;
    pomCtx.imageSmoothingEnabled = false;
    pomCtx.drawImage(z.img, 0, h, w, h, 0, 0, w, h); // vrstva vidlice
    pomCtx.globalCompositeOperation = 'source-in';
    pomCtx.fillStyle = vidlica; pomCtx.fillRect(0,0,w,h);
    pomCtx.globalCompositeOperation = 'source-over';
    g.drawImage(pomPlatno, 0, 0);
  }
  z.kluc = kluc;
  return c;
}

// Farby bicyklov. Vzorkovníky platia pre tmavé pozadie; na svetlom sa obrátia,
// inak by sivá na bielej zmizla.
const FARBY = { telo:'#6b6b6b', vidlica:'#ffffff' };
const obrat = hex => '#' + [1,3,5].map(i =>
  (255 - parseInt(hex.substr(i,2),16)).toString(16).padStart(2,'0')).join('');

// Zlomy sedia s @keyframes fg – v týchto úsekoch cyklu je pozadie svetlé.
const SVETLE_USEKY = [[29.16,45.83],[62.5,95.83]];

// Čas sa neberie z performance.now(), ale priamo z CSS animácie pozadia. Inak by
// sa to rozišlo pri každom zaváhaní (iná štartovacia značka, prerušené vykresľovanie).
let animPozadia = null;
function podielCyklu(){
  if(!animPozadia || animPozadia.playState !== 'running')
    animPozadia = document.body.getAnimations?.().find(a => a.animationName === 'bg') || null;
  if(!animPozadia) return 0;
  const trvanie = animPozadia.effect.getTiming().duration;
  return (animPozadia.currentTime % trvanie) / trvanie * 100;
}

function farbyTeraz(){
  let svetle;
  if(rezimPozadia === 'biela') svetle = true;
  else if(rezimPozadia === 'cierna') svetle = false;
  else { const t = podielCyklu(); svetle = SVETLE_USEKY.some(([a,b]) => t >= a && t < b); }
  return svetle ? [obrat(FARBY.telo), obrat(FARBY.vidlica)]
                : [FARBY.telo, FARBY.vidlica];
}

// ---------------------------------------------------------------------------
const platno = document.getElementById('plocha');
const ctx = platno.getContext('2d');
let W=0, H=0;
function prisposob(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  platno.width = Math.round(W*dpr); platno.height = Math.round(H*dpr);
  platno.style.width = W+'px'; platno.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', prisposob); prisposob();

const N = {pocet:12, rychlost:1, mierka:1, pauzy:.63, mix:[33,33,34]};
let zapnute = false;               // bicykle sú implicitne vypnuté, zapína ich B

// Na telefónoch a tabletoch sa bicykle nepúšťajú vôbec – nie je klávesnica, ťahanie
// prstom nedáva zmysel a je to zbytočná záťaž na batériu.
// Na testovanie sa dá obísť cez ?bicykle=1
const MOBIL = (matchMedia('(pointer:coarse)').matches || innerWidth < 700)
              && !new URLSearchParams(location.search).has('bicykle');

const nah  = (a,b) => a + Math.random()*(b-a);

let aktivnaSada = 'nova';       // nova | stara | obe – prepína sa v paneli
let rezimPozadia = 'rotacia';

function staryTyp(){
  const suma = N.mix.reduce((a,b)=>a+b,0);
  if(suma <= 0) return STARE_TYPY[0];
  let r = Math.random()*suma;
  for(let i=0;i<STARE_TYPY.length;i++){ r -= N.mix[i]; if(r<=0) return STARE_TYPY[i]; }
  return STARE_TYPY[0];
}

function nahodnyTyp(){
  if(aktivnaSada === 'stara') return staryTyp();
  if(aktivnaSada === 'nova')  return 'mestsky-96';
  return Math.random() < .5 ? 'mestsky-96' : staryTyp();
}

// ---------------------------------------------------------------------------
let bicykle = [], castice = [], cakajuNaObnovu = 0;

function novy(x,y){
  const b = {
    x: x ?? nah(0,W), y: y ?? nah(0,H), typ: nahodnyTyp(),
    dx:0, dy:0, stav:'stoji', cas:0, snimka:0, snimkaCas:0,
    vlastnaRychlost: nah(.8,1.25), drzany:false, mrka:0,
  };
  zmenStav(b, Math.random()<.5 ? 'ide' : 'stoji');
  b.cas = nah(0,2);                       // rozhádzané štarty
  return b;
}

function zmenStav(b, stav){
  b.stav = stav; b.snimka = 0; b.snimkaCas = 0;
  if(stav === 'ide'){
    const u = smerVon(b);
    b.dx = Math.cos(u); b.dy = Math.sin(u);
    b.cas = nah(2,7);
  } else b.cas = nah(1,5);
}

function smerVon(b){
  const okraj = 60;
  if(b.x<okraj || b.x>W-okraj || b.y<okraj || b.y>H-okraj)
    return Math.atan2(H/2-b.y, W/2-b.x) + nah(-.5,.5);
  const teraz = Math.atan2(b.dy,b.dx);
  const zmena = (Math.random()<.5?-1:1) * nah(Math.PI/4, Math.PI*.75);
  return (b.dx||b.dy) ? teraz+zmena : nah(0, Math.PI*2);
}

function vybuchni(b){
  for(let i=0;i<14;i++){
    const a = nah(0,Math.PI*2), v = nah(30,150);
    castice.push({x:b.x,y:b.y,dx:Math.cos(a)*v,dy:Math.sin(a)*v,zivot:nah(.4,.9),max:.9,r:nah(1,2.5)});
  }
  bicykle.splice(bicykle.indexOf(b),1);
  cakajuNaObnovu++;
  setTimeout(() => {
    if(cakajuNaObnovu<=0) return;
    cakajuNaObnovu--;
    const zhora = Math.random()<.5;
    bicykle.push(novy(zhora?nah(0,W):(Math.random()<.5?-30:W+30),
                      zhora?(Math.random()<.5?-30:H+30):nah(0,H)));
  }, nah(1500,4000));
}

function rozdvoj(b){
  const a = Math.atan2(b.dy,b.dx);
  for(const s of [-1,1]){
    const n = novy(b.x,b.y); zmenStav(n,'ide');
    n.dx = Math.cos(a+s*.9); n.dy = Math.sin(a+s*.9);
    bicykle.push(n);
  }
  for(let i=0;i<6;i++){
    const u=nah(0,Math.PI*2), v=nah(20,60);
    castice.push({x:b.x,y:b.y,dx:Math.cos(u)*v,dy:Math.sin(u)*v,zivot:.35,max:.35,r:1.5});
  }
  bicykle.splice(bicykle.indexOf(b),1);
}

const polomer = b => KUSY[b.typ].sada.bunka*.42*N.mierka;

function update(dt){
  while(bicykle.length + cakajuNaObnovu < N.pocet) bicykle.push(novy());
  while(bicykle.length > N.pocet) bicykle.pop();

  for(const b of bicykle){
    if(b.drzany) continue;
    b.cas -= dt;
    if(b.cas <= 0){
      if(b.stav === 'ide'){
        const r = Math.random();
        if(r < .09){ vybuchni(b); continue; }
        if(r < .14){ rozdvoj(b);  continue; }
        zmenStav(b, Math.random() < N.pauzy ? 'stoji' : 'ide');
      } else zmenStav(b,'ide');
    }
    if(b.stav === 'ide'){
      const v = 34 * N.rychlost * b.vlastnaRychlost;
      b.x += b.dx*v*dt; b.y += b.dy*v*dt;
      const m = polomer(b);
      if(b.x<-m||b.x>W+m||b.y<-m||b.y>H+m) zmenStav(b,'ide');
    }
    if(b.mrka > 0) b.mrka -= dt;
    const tempo = b.stav==='ide' ? .11/Math.max(.35, N.rychlost*b.vlastnaRychlost) : .22;
    b.snimkaCas += dt;
    if(b.snimkaCas >= tempo){ b.snimkaCas = 0; b.snimka = (b.snimka+1)%KUSY[b.typ].sada.snimok; }
  }

  for(let i=castice.length-1;i>=0;i--){
    const c = castice[i];
    c.x += c.dx*dt; c.y += c.dy*dt; c.dx*=.94; c.dy*=.94;
    c.zivot -= dt; if(c.zivot<=0) castice.splice(i,1);
  }
}

function kresli(){
  ctx.clearRect(0,0,W,H);
  if(!zapnute) return;

  const [telo, vidlica] = farbyTeraz();

  // dojem plochy: kto je nižšie, kreslí sa navrch
  for(const b of bicykle.slice().sort((a,b)=>a.y-b.y)){
    const z = KUSY[b.typ]; if(!z || !z.img) continue;
    const s = z.sada, B = s.bunka, d = B*N.mierka;
    const sheet = prefarbeny(z, telo, vidlica);
    let riadok, flip, snimka = b.drzany ? 0 : b.snimka;
    if(b.stav === 'stoji' && !b.drzany){
      flip = b.dx < 0;
      // sada bez nakresleného trackstandu stojí na bočnom pohľade, zmrazenom na 1. snímke
      if(s.maTrackstand) riadok = s.riadok.TRACKSTAND;
      else { riadok = s.riadok.E; snimka = 0; }
    } else {
      const k = SEKTOR[((Math.round(Math.atan2(b.dy,b.dx)/(Math.PI/4))%8)+8)%8];
      riadok = s.riadok[k.smer]; flip = k.flip;
    }
    ctx.save();
    ctx.translate(Math.round(b.x), Math.round(b.y));
    if(b.drzany) ctx.translate(0,-6);
    if(flip) ctx.scale(-1,1);
    if(b.mrka > 0) ctx.globalAlpha = (Math.floor(b.mrka*20)%2) ? .35 : 1;
    ctx.drawImage(sheet, (snimka % s.snimok)*B, riadok*B, B, B, -d/2, -d/2, d, d);
    ctx.restore();
  }

  ctx.fillStyle = vidlica;
  for(const c of castice){
    ctx.globalAlpha = Math.max(0, c.zivot/c.max);
    ctx.fillRect(Math.round(c.x-c.r), Math.round(c.y-c.r), c.r*2, c.r*2);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// Myš
// ---------------------------------------------------------------------------
function podKurzorom(px,py){
  if(!zapnute) return null;
  for(let i=bicykle.length-1;i>=0;i--){
    const b = bicykle[i], m = polomer(b);
    if(Math.abs(px-b.x)<m && Math.abs(py-b.y)<m) return b;
  }
  return null;
}
let tahany=null, tahaneOd=null, poslednaPoloha=null;

platno.addEventListener('pointermove', e => {
  if(tahany){
    poslednaPoloha = {x:e.clientX, y:e.clientY};
    tahany.x = e.clientX; tahany.y = e.clientY;
    return;
  }
  platno.classList.toggle('mozem-chytit', !!podKurzorom(e.clientX,e.clientY));
});

platno.addEventListener('pointerdown', e => {
  const b = podKurzorom(e.clientX,e.clientY); if(!b) return;
  tahany = b; b.drzany = true;
  tahaneOd = {x:e.clientX, y:e.clientY};
  poslednaPoloha = {x:e.clientX, y:e.clientY};
  platno.setPointerCapture(e.pointerId);
  platno.classList.add('chytam');
});

addEventListener('pointerup', e => {
  if(!tahany) return;
  const b = tahany;
  const posun = Math.hypot(e.clientX-tahaneOd.x, e.clientY-tahaneOd.y);
  b.drzany = false;
  platno.classList.remove('chytam');
  if(posun < 5){
    if(Math.random() < .10){ vybuchni(b); tahany = null; return; }   // 1 klik z 10 = výbuch
    b.mrka = .45; zmenStav(b,'stoji'); b.cas = .8;
  }
  else {
    zmenStav(b,'ide');
    let dx = e.clientX-poslednaPoloha.x, dy = e.clientY-poslednaPoloha.y;
    if(dx||dy){ const l=Math.hypot(dx,dy); b.dx=dx/l; b.dy=dy/l; }
  }
  tahany = null;
});

// ---------------------------------------------------------------------------
// Panel
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const panel = $('panel');

const naviaz = (id,out,key,prevod,fmt) => {
  const el = $(id);
  const nastav = () => { N[key] = prevod(+el.value); $(out).textContent = fmt(+el.value); };
  el.addEventListener('input', nastav); nastav();
};
naviaz('cPocet','vPocet','pocet', v=>v, v=>v);
naviaz('cRychlost','vRychlost','rychlost', v=>v/100, v=>(v/100).toFixed(1));
naviaz('cMierka','vMierka','mierka', v=>v/10, v=>(v/10).toFixed(1));
naviaz('cPauzy','vPauzy','pauzy', v=>v/100, v=>v);

// Pomer typov: posuvníky sú priamo percentá a ich súčet je vždy 100.
// Keď posunieš jeden, zvyšok sa rozdelí medzi ostatné dva v pomere, aký mali.
const mixEl = [0,1,2].map(i => $('cMix'+i));
function zobrazMix(){
  mixEl.forEach((el,i) => { el.value = N.mix[i]; $('vMix'+i).textContent = N.mix[i]+'%'; });
}
function upravMix(i){
  const nova = +mixEl[i].value, zvysok = 100 - nova;
  const [a,b] = [0,1,2].filter(j => j !== i);
  const sucet = N.mix[a] + N.mix[b];
  if(sucet <= 0){ N.mix[a] = Math.floor(zvysok/2); N.mix[b] = zvysok - N.mix[a]; }
  else { N.mix[a] = Math.round(zvysok * N.mix[a]/sucet); N.mix[b] = zvysok - N.mix[a]; }
  N.mix[i] = nova;
  zobrazMix();
  for(const bic of bicykle) bic.typ = nahodnyTyp();   // hneď vidieť efekt
}
mixEl.forEach((el,i) => el.addEventListener('input', () => upravMix(i)));
zobrazMix();

const selPozadie = $('cPozadie');
function nastavPozadie(){
  rezimPozadia = selPozadie.value;
  document.body.classList.toggle('stat', rezimPozadia !== 'rotacia');
  document.body.classList.toggle('stat-cierna', rezimPozadia === 'cierna');
  document.body.classList.toggle('stat-biela',  rezimPozadia === 'biela');
}
selPozadie.addEventListener('change', nastavPozadie);
nastavPozadie();

for(const [id, key] of [['cTelo','telo'], ['cVidlica','vidlica']]){
  const el = $(id);
  el.addEventListener('input', () => { FARBY[key] = el.value; });
  FARBY[key] = el.value;
}

const selSada = $('cSada');
function nastavSadu(){
  aktivnaSada = selSada.value;
  $('gMix').classList.toggle('tlmena', aktivnaSada === 'nova');
  for(const bic of bicykle) bic.typ = nahodnyTyp();   // hneď vidieť efekt
}
selSada.addEventListener('change', nastavSadu);
nastavSadu();

// ---------------------------------------------------------------------------
// Klávesy: B zapína bicykle, H panel. Nikde to nie je napísané – nech sa to nájde.
// ---------------------------------------------------------------------------
addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k === 'b'){
    if(MOBIL) return;
    zapnute = !zapnute;
    if(!zapnute){ bicykle = []; castice = []; cakajuNaObnovu = 0; }
  } else if(k === 'h'){
    panel.hidden = !panel.hidden;
  }
});

// ---------------------------------------------------------------------------
let posledny = performance.now(), fpsAkum = 0, fpsPocet = 0;
function slucka(teraz){
  const dt = Math.min((teraz-posledny)/1000, .05);
  posledny = teraz;
  if(zapnute) update(dt);
  kresli();
  fpsAkum += dt; fpsPocet++;
  if(fpsAkum >= .5){ $('fps').textContent = Math.round(fpsPocet/fpsAkum); fpsAkum=0; fpsPocet=0; }
  requestAnimationFrame(slucka);
}
requestAnimationFrame(slucka);
})();
</script>
